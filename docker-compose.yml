services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/stylesense.db}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173", "http://127.0.0.1:5173"]}
      SEED_CATALOGUE_ON_START: ${SEED_CATALOGUE_ON_START:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_ACCESS_SECONDS: ${AUTH_ACCESS_SECONDS:-300}
      AUTH_REFRESH_DAYS: ${AUTH_REFRESH_DAYS:-7}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_EMAIL_MODE: ${AUTH_EMAIL_MODE:-outbox}
      AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-5}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-900}
      AUTH_PASSWORD_COMPLEXITY: ${AUTH_PASSWORD_COMPLEXITY:-true}
      AUTH_OUTBOX_DIR: /data/dev-mail
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-noreply@stylesense.example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-false}
      DEMO_CUSTOMER_EMAIL: ${DEMO_CUSTOMER_EMAIL:-customer@stylesense.example.com}
      DEMO_PRODUCT_MANAGER_EMAIL: ${DEMO_PRODUCT_MANAGER_EMAIL:-product_manager@stylesense.example.com}
      DEMO_OPERATIONS_MANAGER_EMAIL: ${DEMO_OPERATIONS_MANAGER_EMAIL:-operations_manager@stylesense.example.com}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@stylesense.example.com}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:-}
      DEMO_PRODUCT_MANAGER_PASSWORD: ${DEMO_PRODUCT_MANAGER_PASSWORD:-}
      DEMO_OPERATIONS_MANAGER_PASSWORD: ${DEMO_OPERATIONS_MANAGER_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - stylesense-data:/data
      - stylesense-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  stylesense-data:
  stylesense-uploads:
